name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Normalise the tag to the four-part form Jellyfin compares against
    # (PluginInfo.Version is always major.minor.build.revision).
    - name: Resolve version
      id: version
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        IFS='.' read -r major minor build revision <<< "$TAG_VERSION"
        VERSION="${major:-0}.${minor:-0}.${build:-0}.${revision:-0}"
        echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_OUTPUT"
        echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Resolved $GITHUB_REF -> $VERSION (tag: $TAG_VERSION)"

    - name: Build plugin package
      id: jprm
      uses: oddstr13/jellyfin-plugin-repository-manager@v1.1.1
      with:
        version: ${{ steps.version.outputs.VERSION }}
        output: ./artifacts

    # JPRM writes "image" into meta.json, but Jellyfin's plugin manifest reader
    # only looks at "imagePath", so a manual install (no catalog refresh) would
    # have no icon at all.
    - name: Add imagePath to package metadata
      run: |
        python3 - "${{ steps.jprm.outputs.artifact }}" <<'PY'
        import json, os, shutil, sys, zipfile

        path = sys.argv[1]
        tmp = path + ".tmp"
        with zipfile.ZipFile(path) as zin, zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED) as zout:
            for item in zin.infolist():
                data = zin.read(item.filename)
                if item.filename == "meta.json":
                    meta = json.loads(data)
                    if meta.get("image") and not meta.get("imagePath"):
                        meta["imagePath"] = meta["image"]
                    data = json.dumps(meta, indent=4, sort_keys=True).encode()
                zout.writestr(item, data)
        shutil.move(tmp, path)
        print("meta.json imagePath set")
        PY

    # JPRM writes meta.json, the assembly version and the zip name from the same
    # value; fail loudly if that ever stops being true.
    - name: Verify package metadata
      run: |
        TARGET_ABI=$(sed -n 's/^targetAbi: *"\([^"]*\)".*/\1/p' build.yaml)
        unzip -p "${{ steps.jprm.outputs.artifact }}" meta.json \
          | jq -e --arg v "${{ steps.version.outputs.VERSION }}" --arg a "$TARGET_ABI" \
              '.version == $v and .targetAbi == $a and .imagePath == "thumb.png"' > /dev/null
        echo "Package reports ${{ steps.version.outputs.VERSION }} for target ABI $TARGET_ABI"

    - name: Calculate checksum
      id: checksum
      run: |
        CHECKSUM=$(md5sum "${{ steps.jprm.outputs.artifact }}" | awk '{print toupper($1)}')
        echo "CHECKSUM=$CHECKSUM" >> "$GITHUB_OUTPUT"
        echo "Checksum: $CHECKSUM"

    - name: Prepare release notes
      id: release_notes
      env:
        TAG_VERSION: ${{ steps.version.outputs.TAG_VERSION }}
      run: |
        # Notes are named after the tag (v3.0.0.md); fall back to the four-part form.
        RELEASE_NOTES_FILE="release-notes/RELEASE_NOTES_v${TAG_VERSION}.md"
        if [ ! -f "$RELEASE_NOTES_FILE" ]; then
          RELEASE_NOTES_FILE="release-notes/RELEASE_NOTES_v${{ steps.version.outputs.VERSION }}.md"
        fi

        if [ -f "$RELEASE_NOTES_FILE" ]; then
          echo "Release notes file found: $RELEASE_NOTES_FILE"
          cat "$RELEASE_NOTES_FILE" > release_body.md
        else
          echo "Release notes file not found for v${TAG_VERSION}"
          echo "## Ambilight v${{ steps.version.outputs.VERSION }}" > release_body.md
          echo "" >> release_body.md
          echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)." >> release_body.md
        fi

        echo "" >> release_body.md
        echo "---" >> release_body.md
        echo "" >> release_body.md
        echo "## Installation" >> release_body.md
        echo "" >> release_body.md
        echo "Add this repository to Jellyfin under **Dashboard -> Plugins -> Repositories**:" >> release_body.md
        echo "" >> release_body.md
        echo '```' >> release_body.md
        echo "https://raw.githubusercontent.com/${{ github.repository }}/master/manifest.json" >> release_body.md
        echo '```' >> release_body.md
        echo "" >> release_body.md
        echo "Then install **Ambilight** from the catalog and restart Jellyfin." >> release_body.md
        echo "" >> release_body.md
        echo "**MD5 Checksum:** \`${{ steps.checksum.outputs.CHECKSUM }}\`" >> release_body.md

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.jprm.outputs.artifact }}
        body_path: release_body.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update manifest.json
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
        TAG_VERSION: ${{ steps.version.outputs.TAG_VERSION }}
        CHECKSUM: ${{ steps.checksum.outputs.CHECKSUM }}
        ARTIFACT_NAME: ${{ steps.jprm.outputs.artifact }}
        TAG: ${{ github.ref_name }}
        REPOSITORY: ${{ github.repository }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git fetch origin master
        git checkout master
        git pull origin master

        TARGET_ABI=$(sed -n 's/^targetAbi: *"\([^"]*\)".*/\1/p' build.yaml)
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        ZIP_NAME=$(basename "$ARTIFACT_NAME")
        SOURCE_URL="https://github.com/${REPOSITORY}/releases/download/${TAG}/${ZIP_NAME}"

        RELEASE_NOTES_FILE="release-notes/RELEASE_NOTES_v${TAG_VERSION}.md"
        if [ ! -f "$RELEASE_NOTES_FILE" ]; then
          RELEASE_NOTES_FILE="release-notes/RELEASE_NOTES_v${VERSION}.md"
        fi

        if [ -f "$RELEASE_NOTES_FILE" ]; then
          CHANGELOG=$(jq -Rs . < "$RELEASE_NOTES_FILE")
        else
          CHANGELOG=$(printf 'See release notes at: https://github.com/%s/releases/tag/%s' "$REPOSITORY" "$TAG" | jq -Rs .)
        fi

        jq --arg version "$VERSION" \
           --argjson changelog "$CHANGELOG" \
           --arg targetAbi "$TARGET_ABI" \
           --arg sourceUrl "$SOURCE_URL" \
           --arg checksum "$CHECKSUM" \
           --arg timestamp "$TIMESTAMP" \
           '.[0].versions = [{ version: $version, changelog: $changelog, targetAbi: $targetAbi, sourceUrl: $sourceUrl, checksum: $checksum, timestamp: $timestamp }] + [.[0].versions[] | select(.version != $version)]' \
           manifest.json > manifest.json.tmp
        mv manifest.json.tmp manifest.json

        git add manifest.json

        if git diff --staged --quiet; then
          echo "manifest.json already lists $VERSION"
          exit 0
        fi

        git commit -m "Auto-update manifest.json for v${VERSION}"
        git push origin master
